<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Stok Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <!-- Header Navigasi -->
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">📦 System Monitoring Stok</h1>
            <div class="flex gap-2">
                <a href="index.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Home (Index)</a>
                <a href="data_stok.html" class="px-3 py-2 bg-blue-600 rounded-lg text-sm font-semibold">Data Stok</a>
                <a href="barang_masuk.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Barang Masuk</a>
                <a href="barang_keluar.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Barang Keluar</a>
                <a href="purchasing_request.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">PR Tracking</a>
                <a href="rekap_pr.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Rekap Perlu PR</a>
            </div>
        </div>
    </nav>

    <!-- Konten Tabel DATA STOK -->
    <div class="max-w-7xl mx-auto py-8 px-4">
        <h2 class="text-2xl font-bold text-slate-800 mb-4">Laporan Data Stok Master</h2>
        <div class="bg-white rounded-lg shadow overflow-x-auto p-4">
            <table class="w-full text-left border-collapse text-sm">
                <tbody id="table-body">
                    <tr><td class="p-4 text-center">Memuat data dari Google Sheets...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Masukkan URL Google Apps Script Anda
        const API_URL = "URL_GOOGLE_APPS_SCRIPT_ANDA_DI_SINI?sheet=DATA STOK";

        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                let html = "";
                data.forEach((row, index) => {
                    if (index < 3) return; // Skip title headers
                    html += `<tr class="${index === 3 ? 'bg-slate-800 text-white font-bold' : 'border-b hover:bg-slate-50'}">`;
                    row.forEach(cell => {
                        html += `<td class="p-3 border-slate-200">${cell}</td>`;
                    });
                    html += `</tr>`;
                });
                document.getElementById("table-body").innerHTML = html;
            });
    </script>
</body>
</html>
