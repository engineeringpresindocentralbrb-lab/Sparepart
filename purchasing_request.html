<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Tracking (Outstanding)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- OVERLAY LOADING -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900 bg-opacity-60 flex flex-col items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center space-y-4 max-w-xs text-center">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="font-bold text-slate-800">Menyimpan PR...</p>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <h1 class="text-lg sm:text-xl font-bold flex items-center gap-2">📦 <span class="truncate">System Monitoring Stok</span></h1>
                <div class="hidden lg:flex items-center gap-1.5">
                    <a href="index.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Home</a>
                    <a href="data_stok.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Data Stok</a>
                    <a href="barang_masuk.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Barang Masuk</a>
                    <a href="barang_keluar.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Barang Keluar</a>
                    <a href="purchasing_request.html" class="px-3 py-2 bg-blue-600 rounded-lg text-sm font-semibold">PR Tracking</a>
                    <a href="rekap_pr.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Rekap Perlu PR</a>
                    <a href="stock_opname.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Stock Opname</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto py-8 px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- FORM INPUT PR -->
        <div class="bg-white p-6 rounded-xl shadow border border-slate-200">
            <h2 class="text-xl font-bold text-slate-800 mb-4">📝 Buat Purchasing Request (PR)</h2>
            <form id="form-pr" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700">No. PR</label>
                    <input type="text" id="noPR" required placeholder="Contoh: PR-2023-001" class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Nama Barang</label>
                    <input type="text" id="namaBarang" required placeholder="Nama sparepart / barang" class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Tanggal PR</label>
                    <input type="date" id="tanggalPR" required class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Qty PR</label>
                    <input type="number" id="qtyPR" required min="1" class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Keterangan</label>
                    <textarea id="keterangan" class="w-full mt-1 p-2 border rounded-lg"></textarea>
                </div>
                <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition">
                    Simpan PR Baru
                </button>
            </form>
        </div>

        <!-- TABEL TRACKING PR UNOPEN/OPEN ONLY -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Daftar PR Belum Selesai (Outstanding)</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Menampilkan PR dengan status belum Close / belum dibeli.</p>
                </div>
                <button onclick="loadData()" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-slate-700 transition">🔄 Refresh</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <tbody id="table-body">
                        <tr><td class="p-4 text-center">Memuat data PR...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwtwRjIfqeIJ635B32BkmzJkFf6V9617smGYYc1lC48o_-8rgXHYMIP3zNgrD6KMxZ1/exec";

        function setTanggalHariIni() {
            document.getElementById("tanggalPR").value = new Date().toISOString().split('T')[0];
        }

        function loadData() {
            fetch(`${API_URL}?sheet=PURCHASING REQUEST (PR)`)
                .then(res => res.json())
                .then(data => {
                    let html = "";
                    if (!data || data.length <= 4) {
                        html = `<tr><td class="p-4 text-center text-slate-500">Belum ada data PR.</td></tr>`;
                    } else {
                        let countOutstanding = 0;

                        data.forEach((row, index) => {
                            // Tampilkan baris Header (index == 3)
                            if (index === 3) {
                                html += `<tr class="bg-slate-800 text-white font-bold">`;
                                row.forEach(cell => {
                                    html += `<td class="p-3 border-slate-200">${cell !== undefined ? cell : ''}</td>`;
                                });
                                html += `</tr>`;
                                return;
                            }

                            if (index < 3) return;

                            // Penggabungan teks seluruh baris untuk cek status (Case Insensitive)
                            const rowText = row.map(c => String(c).toLowerCase()).join(" ");

                            // Filter: Lewati baris jika sudah "close", "selesai", "lunas", atau "done"
                            const isClosed = rowText.includes("close") || rowText.includes("selesai") || rowText.includes("done");

                            if (!isClosed) {
                                countOutstanding++;
                                html += `<tr class="border-b hover:bg-slate-50">`;
                                row.forEach(cell => {
                                    html += `<td class="p-3 border-slate-200">${cell !== undefined ? cell : ''}</td>`;
                                });
                                html += `</tr>`;
                            }
                        });

                        if (countOutstanding === 0) {
                            html += `<tr><td colspan="100%" class="p-4 text-center text-slate-500">Semua PR telah selesai / Close.</td></tr>`;
                        }
                    }
                    document.getElementById("table-body").innerHTML = html;
                });
        }

        document.getElementById("form-pr").addEventListener("submit", function(e) {
            e.preventDefault();
            const overlay = document.getElementById("loading-overlay");
            overlay.classList.remove("hidden");

            const payload = {
                sheetName: "PURCHASING REQUEST (PR)",
                noPR: document.getElementById("noPR").value,
                namaBarang: document.getElementById("namaBarang").value,
                tanggalPR: document.getElementById("tanggalPR").value,
                qtyPR: document.getElementById("qtyPR").value,
                keterangan: document.getElementById("keterangan").value
            };

            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.result === "success") {
                    alert("✅ PR Baru Berhasil Ditambahkan!");
                    document.getElementById("form-pr").reset();
                    setTanggalHariIni();
                    loadData();
                } else {
                    alert("❌ Gagal: " + res.message);
                }
            })
            .finally(() => overlay.classList.add("hidden"));
        });

        setTanggalHariIni();
        loadData();
    </script>
</body>
</html>
