<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchasing Request Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">📦 System Monitoring Stok</h1>
            <div class="flex gap-2">
                <a href="index.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Home</a>
                <a href="data_stok.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Data Stok</a>
                <a href="barang_masuk.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Barang Masuk</a>
                <a href="barang_keluar.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Barang Keluar</a>
                <a href="purchasing_request.html" class="px-3 py-2 bg-purple-700 rounded-lg text-sm font-semibold">PR Tracking</a>
                <a href="rekap_pr.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Rekap Perlu PR</a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto py-8 px-4">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-slate-800">📋 Laporan Purchasing Request (PR) Tracking</h2>
            <button onclick="loadData()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-2 rounded-lg">🔄 Refresh</button>
        </div>

        <div class="bg-white rounded-lg shadow overflow-x-auto p-4 border border-slate-200">
            <table class="w-full text-left border-collapse text-sm">
                <tbody id="table-body">
                    <tr><td class="p-8 text-center text-slate-500">Memuat data PR...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwtwRjIfqeIJ635B32BkmzJkFf6V9617smGYYc1lC48o_-8rgXHYMIP3zNgrD6KMxZ1/exec?sheet=PURCHASING REQUEST (PR)";

        function formatDate(value) {
            if (!value) return "-";
            if (typeof value === "string" && value.includes("T")) {
                const date = new Date(value);
                if (!isNaN(date.getTime())) {
                    const day = String(date.getDate()).padStart(2, '0');
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const year = date.getFullYear();
                    return `${day}/${month}/${year}`;
                }
            }
            return value;
        }

        function loadData() {
            const tableBody = document.getElementById("table-body");
            tableBody.innerHTML = `<tr><td class="p-8 text-center text-slate-500">Memuat data...</td></tr>`;

            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    let html = "";
                    data.forEach((row, index) => {
                        if (index === 3) {
                            html += `<tr class="bg-slate-900 text-white font-bold">`;
                            row.forEach(cell => { html += `<td class="p-3 border-slate-800">${cell}</td>`; });
                            html += `</tr>`;
                            return;
                        }

                        if (index < 3 || !row[0] || row[0].toString().trim() === "") return;

                        html += `<tr class="border-b hover:bg-slate-50">`;
                        row.forEach((cell, cellIdx) => {
                            let cellVal = (cell !== undefined && cell !== null && cell !== "") ? cell : "-";
                            if (cellIdx === 2 || cellIdx === 4) cellVal = formatDate(cellVal);

                            if (cellIdx === 7) {
                                const statusText = cellVal.toString().toUpperCase();
                                if (statusText.includes("FOLLOW UP")) {
                                    cellVal = `<span class="px-2.5 py-1 bg-red-100 text-red-800 font-bold rounded-full text-xs">⚠️ ${cellVal}</span>`;
                                } else if (statusText.includes("CLOSE")) {
                                    cellVal = `<span class="px-2.5 py-1 bg-green-100 text-green-800 font-bold rounded-full text-xs">✅ ${cellVal}</span>`;
                                } else if (statusText.includes("ON PROCESS")) {
                                    cellVal = `<span class="px-2.5 py-1 bg-amber-100 text-amber-800 font-bold rounded-full text-xs">⏳ ${cellVal}</span>`;
                                }
                            }
                            html += `<td class="p-3 border-slate-200">${cellVal}</td>`;
                        });
                        html += `</tr>`;
                    });
                    tableBody.innerHTML = html;
                });
        }

        loadData();
    </script>
</body>
</html>
