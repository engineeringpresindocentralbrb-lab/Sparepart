<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barang Keluar - Input & Transaksi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">📦 System Monitoring Stok</h1>
            <div class="flex gap-2">
                <a href="index.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Home</a>
                <a href="data_stok.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Data Stok</a>
                <a href="barang_masuk.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Barang Masuk</a>
                <a href="barang_keluar.html" class="px-3 py-2 bg-amber-600 rounded-lg text-sm font-semibold">Barang Keluar</a>
                <a href="purchasing_request.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">PR Tracking</a>
                <a href="rekap_pr.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Rekap Perlu PR</a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto py-8 px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="bg-white p-6 rounded-xl shadow border">
            <h2 class="text-xl font-bold text-slate-800 mb-4">📤 Form Input Barang Keluar</h2>
            <form id="form-keluar" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Tanggal</label>
                    <input type="date" id="tanggal" required class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Mesin</label>
                    <input type="text" id="mesin" placeholder="Contoh: D11, C14" class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Nama Sparepart</label>
                    <input type="text" id="sparepart" required placeholder="Contoh: Air duster" class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Jumlah (Qty)</label>
                    <input type="number" id="qty" required min="1" value="1" class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Nama Pemakai</label>
                    <input type="text" id="nama" placeholder="Contoh: Wafis / Abdul" class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Keterangan</label>
                    <textarea id="keterangan" placeholder="Catatan perbaikan" class="w-full mt-1 p-2 border rounded-lg"></textarea>
                </div>
                <button type="submit" id="btn-submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg transition">
                    Simpan Barang Keluar
                </button>
            </form>
        </div>

        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow border">
            <h2 class="text-xl font-bold text-slate-800 mb-4">Riwayat Barang Keluar</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <tbody id="table-body">
                        <tr><td class="p-4 text-center">Memuat data transaksi...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwtwRjIfqeIJ635B32BkmzJkFf6V9617smGYYc1lC48o_-8rgXHYMIP3zNgrD6KMxZ1/exec";

        function loadData() {
            fetch(`${API_URL}?sheet=BARANG KELUAR`)
                .then(res => res.json())
                .then(data => {
                    let html = "";
                    data.forEach((row, index) => {
                        if (index < 3) return;
                        html += `<tr class="${index === 3 ? 'bg-slate-800 text-white font-bold' : 'border-b hover:bg-slate-50'}">`;
                        row.forEach(cell => { html += `<td class="p-3 border-slate-200">${cell}</td>`; });
                        html += `</tr>`;
                    });
                    document.getElementById("table-body").innerHTML = html;
                });
        }

        document.getElementById("form-keluar").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-submit");
            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            const payload = {
                sheetName: "BARANG KELUAR",
                tanggal: document.getElementById("tanggal").value,
                mesin: document.getElementById("mesin").value,
                sparepart: document.getElementById("sparepart").value,
                qty: document.getElementById("qty").value,
                nama: document.getElementById("nama").value,
                keterangan: document.getElementById("keterangan").value
            };

            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(res => {
                alert("Berhasil Disimpan!");
                document.getElementById("form-keluar").reset();
                btn.innerText = "Simpan Barang Keluar";
                btn.disabled = false;
                loadData();
            });
        });

        loadData();
    </script>
</body>
</html>
