<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barang Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
     <!-- NAVBAR RESPONSIF -->
    <nav class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo / Title -->
                <h1 class="text-lg sm:text-xl font-bold flex items-center gap-2">
                    📦 <span class="truncate">System Monitoring Stok</span>
                </h1>

                <!-- Hamburger Button (Mobile Only) -->
                <button id="menu-btn" type="button" class="lg:hidden p-2 rounded-md text-slate-300 hover:text-white hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path id="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <!-- Navigation Links (Desktop) -->
                <div class="hidden lg:flex items-center gap-1.5 xl:gap-2">
                    <a href="index.html" class="px-3 py-2 bg-blue-600 rounded-lg text-sm font-semibold transition">Home</a>
                    <a href="data_stok.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg text-sm transition">Data Stok</a>
                    <a href="barang_masuk.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg text-sm transition">Barang Masuk</a>
                    <a href="barang_keluar.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg text-sm transition">Barang Keluar</a>
                    <a href="purchasing_request.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg text-sm transition">PR Tracking</a>
                    <a href="rekap_pr.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg text-sm transition">Rekap Perlu PR</a>
                    <a href="stock_opname.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg text-sm transition">Stock Opname</a>
                </div>
            </div>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden lg:hidden bg-slate-800 border-t border-slate-700 px-4 pt-2 pb-4 space-y-1">
            <a href="index.html" class="block px-3 py-2.5 bg-blue-600 rounded-lg text-base font-semibold text-white">Home</a>
            <a href="data_stok.html" class="block px-3 py-2.5 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg text-base">Data Stok</a>
            <a href="barang_masuk.html" class="block px-3 py-2.5 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg text-base">Barang Masuk</a>
            <a href="barang_keluar.html" class="block px-3 py-2.5 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg text-base">Barang Keluar</a>
            <a href="purchasing_request.html" class="block px-3 py-2.5 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg text-base">PR Tracking</a>
            <a href="rekap_pr.html" class="block px-3 py-2.5 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg text-base">Rekap Perlu PR</a>
            <a href="stock_opname.html" class="block px-3 py-2.5 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg text-base">Stock Opname</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto py-8 px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="bg-white p-6 rounded-xl shadow border border-slate-200">
            <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">📤 Form Input Barang Keluar</h2>
            <form id="form-keluar" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Tanggal</label>
                    <input type="date" id="tanggal" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Mesin</label>
                    <input type="text" id="mesin" placeholder="Contoh: D11, C14" class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Nama Sparepart (Wajib ada di Stok)</label>
                    <input type="text" id="sparepart" list="sparepart-list" required placeholder="Ketik atau pilih sparepart..." class="w-full mt-1 p-2 border rounded-lg">
                    <datalist id="sparepart-list"></datalist>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Jumlah (Qty)</label>
                    <input type="number" id="qty" required min="1" value="1" class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Nama Pemakai</label>
                    <input type="text" id="nama" placeholder="Contoh: Wafis" class="w-full mt-1 p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Keterangan</label>
                    <textarea id="keterangan" placeholder="Catatan perbaikan" class="w-full mt-1 p-2 border rounded-lg"></textarea>
                </div>
                <button type="submit" id="btn-submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg transition">
                    Simpan Barang Keluar
                </button>
            </form>
        </div>

        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow border border-slate-200">
            <h2 class="text-xl font-bold text-slate-800 mb-4">Riwayat Barang Keluar</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <tbody id="table-body">
                        <tr><td class="p-4 text-center">Memuat data transaksi...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwtwRjIfqeIJ635B32BkmzJkFf6V9617smGYYc1lC48o_-8rgXHYMIP3zNgrD6KMxZ1/exec";
        let validSpareparts = [];

        function formatDate(value) {
            if (!value) return "-";
            if (typeof value === "string" && value.includes("T")) {
                const date = new Date(value);
                if (!isNaN(date.getTime())) {
                    const day = String(date.getDate()).padStart(2, '0');
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const year = date.getFullYear();
                    return `${day}/${month}/${year}`;
                }
            }
            return value;
        }

        function loadSparepartsList() {
            fetch(`${API_URL}?action=getSpareparts`)
                .then(res => res.json())
                .then(data => {
                    validSpareparts = data;
                    let optionsHtml = "";
                    data.forEach(item => { optionsHtml += `<option value="${item}">`; });
                    document.getElementById("sparepart-list").innerHTML = optionsHtml;
                });
        }

        function loadData() {
            fetch(`${API_URL}?sheet=BARANG KELUAR`)
                .then(res => res.json())
                .then(data => {
                    let html = "";
                    data.forEach((row, index) => {
                        if (index < 3) return;
                        html += `<tr class="${index === 3 ? 'bg-slate-800 text-white font-bold' : 'border-b hover:bg-slate-50'}">`;
                        row.forEach((cell, cellIdx) => {
                            let cellVal = (cell !== undefined && cell !== null) ? cell : '';
                            if (cellIdx === 0 && index > 3) cellVal = formatDate(cellVal);
                            html += `<td class="p-3 border-slate-200">${cellVal}</td>`;
                        });
                        html += `</tr>`;
                    });
                    document.getElementById("table-body").innerHTML = html;
                });
        }

        document.getElementById("form-keluar").addEventListener("submit", function(e) {
            e.preventDefault();
            const sparepartInput = document.getElementById("sparepart").value.trim();
            const isValid = validSpareparts.some(item => item.toLowerCase() === sparepartInput.toLowerCase());

            if (!isValid) {
                alert(`⚠️ NAMA SPAREPART TIDAK DITEMUKAN!\n\nNama "${sparepartInput}" tidak ada di DATA STOK master.\nSilahkan pilih dari pilihan dropdown.`);
                return;
            }

            const btn = document.getElementById("btn-submit");
            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            const payload = {
                sheetName: "BARANG KELUAR",
                tanggal: document.getElementById("tanggal").value,
                mesin: document.getElementById("mesin").value,
                sparepart: sparepartInput,
                qty: document.getElementById("qty").value,
                nama: document.getElementById("nama").value,
                keterangan: document.getElementById("keterangan").value
            };

            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(res => {
                if(res.result === "success") {
                    alert("Berhasil Disimpan!");
                    document.getElementById("form-keluar").reset();
                    loadData();
                } else {
                    alert(res.message);
                }
                btn.innerText = "Simpan Barang Keluar";
                btn.disabled = false;
            });
        });

        loadSparepartsList();
        loadData();
    </script>
</body>
</html>
