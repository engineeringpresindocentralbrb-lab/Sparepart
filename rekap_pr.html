<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Perlu PR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">📦 System Monitoring Stok</h1>
            <div class="flex gap-2">
                <a href="index.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Home</a>
                <a href="data_stok.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Data Stok</a>
                <a href="barang_masuk.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Barang Masuk</a>
                <a href="barang_keluar.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">Barang Keluar</a>
                <a href="purchasing_request.html" class="px-3 py-2 text-slate-300 hover:bg-slate-800 rounded-lg text-sm">PR Tracking</a>
                <a href="rekap_pr.html" class="px-3 py-2 bg-red-700 rounded-lg text-sm font-semibold">Rekap Perlu PR</a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto py-8 px-4">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-red-700 flex items-center gap-2">⚠️ Daftar Rekap Barang Perlu Purchasing Request (PR)</h2>
            <button onclick="loadData()" class="bg-red-800 hover:bg-red-700 text-white text-xs px-3 py-2 rounded-lg">🔄 Refresh</button>
        </div>

        <div class="bg-white rounded-lg shadow overflow-x-auto p-4 border border-red-200">
            <table class="w-full text-left border-collapse text-sm">
                <tbody id="table-body">
                    <tr><td class="p-8 text-center text-slate-500">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwtwRjIfqeIJ635B32BkmzJkFf6V9617smGYYc1lC48o_-8rgXHYMIP3zNgrD6KMxZ1/exec?sheet=DATA STOK";

        function loadData() {
            const tableBody = document.getElementById("table-body");
            tableBody.innerHTML = `<tr><td class="p-8 text-center text-slate-500">Memuat data...</td></tr>`;

            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    let html = "";
                    let headerRow = "";
                    let filteredCount = 0;

                    let statusColIndex = 8;
                    let sisaStokIndex = 6;
                    let batasMinIndex = 7;

                    if (data.length > 3) {
                        const headers = data[3];
                        headers.forEach((h, idx) => {
                            const headerText = h.toString().toUpperCase().trim();
                            if (headerText.includes("STATUS RE-ORDER")) statusColIndex = idx;
                            if (headerText.includes("SISA STOK")) sisaStokIndex = idx;
                            if (headerText.includes("BATAS MINIMAL")) batasMinIndex = idx;
                        });
                    }

                    data.forEach((row, index) => {
                        if (index === 3) {
                            headerRow = `<tr class="bg-red-900 text-white font-bold">`;
                            row.forEach(cell => { headerRow += `<td class="p-3 border-red-800">${cell}</td>`; });
                            headerRow += `</tr>`;
                            return;
                        }

                        if (index < 3) return;

                        const statusVal = row[statusColIndex] ? row[statusColIndex].toString().toUpperCase().trim() : "";
                        const isStatusPerluPR = statusVal.includes("PERLU PR");
                        const sisaStok = Number(row[sisaStokIndex]) || 0;
                        const batasMin = Number(row[batasMinIndex]) || 0;
                        const isStokKurang = (sisaStok <= batasMin);

                        if (isStatusPerluPR || isStokKurang) {
                            filteredCount++;
                            html += `<tr class="border-b bg-red-50 hover:bg-red-100 transition">`;
                            row.forEach((cell, cellIdx) => {
                                const val = (cell !== undefined && cell !== null) ? cell : '';
                                if (cellIdx === statusColIndex) {
                                    html += `<td class="p-3 font-bold text-red-700">⚠️ PERLU PR</td>`;
                                } else {
                                    html += `<td class="p-3 border-slate-200">${val}</td>`;
                                }
                            });
                            html += `</tr>`;
                        }
                    });

                    if (filteredCount === 0) {
                        tableBody.innerHTML = headerRow + `<tr><td colspan="12" class="p-6 text-center text-green-700 font-bold bg-green-50">✅ Semua stok aman!</td></tr>`;
                    } else {
                        tableBody.innerHTML = headerRow + html;
                    }
                });
        }

        loadData();
    </script>
</body>
</html>
